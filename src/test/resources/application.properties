# Tests use their own SQLite file under target/ so they never touch the app's diary.db.
# `mvn clean` removes it; schema/data init is idempotent and @Transactional rolls back each test.
spring.datasource.url=jdbc:sqlite:target/diary-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
