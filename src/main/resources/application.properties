spring.application.name=dear-diary
server.port=8080

# Persistent SQLite file created in the project directory. Inspect it with, e.g.:
#   sqlite3 diary.db "SELECT * FROM entries;"
spring.datasource.url=jdbc:sqlite:diary.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite permits only one writer at a time, so keep a single pooled connection.
spring.datasource.hikari.maximum-pool-size=1

# schema.sql uses CREATE TABLE IF NOT EXISTS and data.sql uses INSERT OR IGNORE,
# so running these on every start is safe and seeds the file only once.
spring.sql.init.mode=always
